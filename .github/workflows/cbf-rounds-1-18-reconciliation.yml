name: Reconcile CBF Série B rounds 1–18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cbf-rounds-1-18-reconciliation.yml"
      - "backend/scripts/reconcile_cbf_rounds_1_18.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-ai-analyst-cbf-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: veltrix-historical-import
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      CBF_RECONCILIATION_PATH: artifacts/cbf-rounds-1-18-reconciliation.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install read-only audit dependencies
        run: python -m pip install -e . PyMuPDF
      - name: Reconcile official CBF detailed schedules against provider rows
        run: python scripts/reconcile_cbf_rounds_1_18.py
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cbf-rounds-1-18-reconciliation
          path: backend/artifacts/cbf-rounds-1-18-reconciliation.json
          if-no-files-found: error
          retention-days: 30

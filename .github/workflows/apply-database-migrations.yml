name: Apply checksum-verified database migrations

on:
  push:
    branches: [main]
    paths:
      - 'backend/migrations/*.sql'
      - '.github/workflows/apply-database-migrations.yml'
  workflow_dispatch:
    inputs:
      confirm_migrations:
        description: Type APPLY_CHECKSUM_VERIFIED_MIGRATIONS to authorize schema migrations
        required: true
        type: choice
        options:
          - NO
          - APPLY_CHECKSUM_VERIFIED_MIGRATIONS
        default: NO

concurrency:
  group: veltrix-ai-analyst-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'push' || inputs.confirm_migrations == 'APPLY_CHECKSUM_VERIFIED_MIGRATIONS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: veltrix-historical-import
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install migration runner
        run: python -m pip install -e .
      - name: Apply ordered checksum-verified migrations
        env:
          DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from app.db.migrations import apply_migrations

          applied = apply_migrations(
              os.environ["DATABASE_URL"],
              expected_database="veltrix_ai_analyst",
              allow_remote=True,
          )
          print("MIGRATIONS_APPLIED:", ",".join(applied) if applied else "none")
          if "006_pre_match_feature_pit_gate.sql" not in applied:
              print("Migration 006 was already applied with a matching checksum.")
          PY
      - name: Verify migration 006-010 checksum ledgers and database objects
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import psycopg

          migrations = {
              "006_pre_match_feature_pit_gate.sql": {
                  "tables": ["pre_match_feature_observations"],
                  "functions": ["enforce_pre_match_feature_pit()"],
                  "triggers": [
                      "pre_match_feature_pit_guard",
                      "pre_match_feature_observations_append_only",
                  ],
              },
              "007_canonical_entity_layer.sql": {
                  "tables": [
                      "canonical_teams",
                      "canonical_competitions",
                      "canonical_fixtures",
                      "provider_team_identity_links",
                      "provider_competition_identity_links",
                      "canonical_fixture_sources",
                      "canonical_identity_review_events",
                  ],
                  "functions": [
                      "enforce_canonical_link_provenance()",
                      "validate_canonical_review_supersession()",
                      "guard_canonical_fixture_source_merge()",
                      "enforce_canonical_fixture_identity_status()",
                  ],
                  "triggers": [
                      "provider_team_identity_link_provenance_guard",
                      "provider_competition_identity_link_provenance_guard",
                      "canonical_fixture_source_provenance_guard",
                      "canonical_fixture_source_merge_guard",
                      "canonical_fixture_identity_status_guard",
                      "canonical_review_supersession_guard",
                      "provider_team_identity_links_append_only",
                      "provider_competition_identity_links_append_only",
                      "canonical_fixture_sources_append_only",
                      "canonical_identity_review_events_append_only",
                  ],
              },
              "008_model_artifacts.sql": {
                  "tables": ["model_artifacts"],
                  "functions": [],
                  "triggers": [],
              },
              "008_canonical_identity_link_uniqueness.sql": {
                  "tables": [],
                  "functions": ["enforce_canonical_link_provenance()"],
                  "triggers": [],
                  "indexes": [
                      "provider_team_identity_links_source_identity_uk",
                      "provider_competition_identity_links_source_identity_uk",
                  ],
              },
              "009_canonical_identity_review_cases.sql": {
                  "tables": [
                      "canonical_identity_review_cases",
                      "canonical_identity_review_case_events",
                      "effective_canonical_identity_review_cases",
                      "canonical_team_identity_provenance_audit",
                      "canonical_fixture_duplicate_case_audit",
                      "canonical_competition_identity_provenance_audit",
                      "canonical_fixture_source_provenance_audit",
                      "canonical_team_alias_case_audit",
                      "effective_canonical_team_aliases",
                      "effective_canonical_fixture_deduplication",
                  ],
                  "functions": [],
                  "triggers": [
                      "canonical_identity_review_cases_append_only",
                      "canonical_identity_review_case_events_append_only",
                  ],
              },
              "010_system_observed_pit.sql": {
                  "tables": [],
                  "functions": ["enforce_pre_match_feature_pit()"],
                  "triggers": [
                      "pre_match_feature_pit_guard",
                      "pre_match_feature_observations_append_only",
                  ],
                  "constraints": [
                      "source_observations_availability_basis_check",
                      "source_observations_pit_evidence_check",
                      "source_observation_sightings_availability_basis_check",
                      "source_observation_sightings_pit_evidence_check",
                  ],
              },
              "012_database_observed_timestamps.sql": {
                  "tables": [],
                  "functions": ["enforce_pre_match_feature_pit()"],
                  "triggers": [
                      "pre_match_feature_pit_guard",
                      "pre_match_feature_observations_append_only",
                  ],
                  "constraints": [
                      "source_observations_pit_evidence_check",
                      "source_observations_system_observed_at_check",
                      "source_observation_sightings_pit_evidence_check",
                      "source_observation_sightings_system_observed_at_check",
                  ],
              },
              "013_target_fixture_pre_match_gate.sql": {
                  "tables": [],
                  "functions": ["enforce_pre_match_feature_pit()"],
                  "triggers": [
                      "pre_match_feature_pit_guard",
                      "pre_match_feature_observations_append_only",
                  ],
                  "indexes": ["pre_match_feature_observations_target_cutoff_idx"],
              },
          }

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              if connection.info.dbname != "veltrix_ai_analyst":
                  raise SystemExit("DATABASE_TARGET_NAME_MISMATCH")
              for filename, expected in migrations.items():
                  migration = Path("migrations") / filename
                  checksum = hashlib.sha256(migration.read_bytes()).hexdigest()
                  row = connection.execute(
                      "SELECT checksum FROM public.schema_migrations WHERE version = %s",
                      (filename,),
                  ).fetchone()
                  if row is None or row[0].strip() != checksum:
                      raise SystemExit(f"MIGRATION_CHECKSUM_VERIFICATION_FAILED:{filename}")

                  for table in expected["tables"]:
                      if connection.execute(
                          "SELECT to_regclass(%s)", (f"veltrix_ai_analyst.{table}",)
                      ).fetchone()[0] is None:
                          raise SystemExit(f"MIGRATION_TABLE_VERIFICATION_FAILED:{table}")

                  for function in expected["functions"]:
                      if connection.execute(
                          "SELECT to_regprocedure(%s)",
                          (f"veltrix_ai_analyst.{function}",),
                      ).fetchone()[0] is None:
                          raise SystemExit(f"MIGRATION_FUNCTION_VERIFICATION_FAILED:{function}")

                  for index in expected.get("indexes", []):
                      if connection.execute(
                          "SELECT to_regclass(%s)", (f"veltrix_ai_analyst.{index}",)
                      ).fetchone()[0] is None:
                          raise SystemExit(f"MIGRATION_INDEX_VERIFICATION_FAILED:{index}")

                  if filename.startswith("006_"):
                      trigger_count = connection.execute(
                          """
                          SELECT COUNT(*) FROM pg_trigger t
                          JOIN pg_class c ON c.oid = t.tgrelid
                          JOIN pg_namespace n ON n.oid = c.relnamespace
                          WHERE n.nspname = 'veltrix_ai_analyst'
                            AND c.relname = 'pre_match_feature_observations'
                            AND NOT t.tgisinternal
                            AND t.tgname = ANY(%s)
                          """,
                          (expected["triggers"],),
                      ).fetchone()[0]
                  else:
                      trigger_count = connection.execute(
                          """
                          SELECT COUNT(*) FROM pg_trigger t
                          JOIN pg_class c ON c.oid = t.tgrelid
                          JOIN pg_namespace n ON n.oid = c.relnamespace
                          WHERE n.nspname = 'veltrix_ai_analyst'
                            AND NOT t.tgisinternal
                            AND t.tgname = ANY(%s)
                          """,
                          (expected["triggers"],),
                      ).fetchone()[0]
                  if trigger_count != len(expected["triggers"]):
                      raise SystemExit(f"MIGRATION_TRIGGER_VERIFICATION_FAILED:{filename}")

                  for constraint in expected.get("constraints", []):
                      constraint_count = connection.execute(
                          """
                          SELECT COUNT(*)
                          FROM pg_constraint constraint_row
                          JOIN pg_namespace namespace
                            ON namespace.oid = constraint_row.connamespace
                          WHERE namespace.nspname = 'veltrix_ai_analyst'
                            AND constraint_row.conname = %s
                          """,
                          (constraint,),
                      ).fetchone()[0]
                      if constraint_count != 1:
                          raise SystemExit(
                              f"MIGRATION_CONSTRAINT_VERIFICATION_FAILED:{filename}:{constraint}"
                          )
                  print(f"{filename} VERIFIED: {checksum}")

              target_fixture = connection.execute(
                  """
                  SELECT is_nullable
                  FROM information_schema.columns
                  WHERE table_schema='veltrix_ai_analyst'
                    AND table_name='pre_match_feature_observations'
                    AND column_name='target_fixture_id'
                  """
              ).fetchone()
              if target_fixture != ("NO",):
                  raise SystemExit("MIGRATION_013_TARGET_FIXTURE_COLUMN_NOT_VERIFIED")
              target_unique = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM pg_constraint
                  WHERE conrelid='veltrix_ai_analyst.pre_match_feature_observations'::regclass
                    AND conname='pre_match_feature_observations_target_source_feature_key'
                    AND contype='u'
                  """
              ).fetchone()[0]
              if target_unique != 1:
                  raise SystemExit("MIGRATION_013_TARGET_UNIQUE_CONSTRAINT_NOT_VERIFIED")
              timestamp_columns = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM information_schema.columns
                  WHERE table_schema='veltrix_ai_analyst'
                    AND column_name='system_observed_at'
                    AND table_name IN (
                      'provider_responses',
                      'source_observations',
                      'source_observation_sightings'
                    )
                  """
              ).fetchone()[0]
              if timestamp_columns != 3:
                  raise SystemExit("MIGRATION_012_DATABASE_TIMESTAMPS_NOT_VERIFIED")
              print("MIGRATIONS_012_013_VERIFIED: database-observed PIT and target fixture cutoff")
              expected_case_counts = {
                  "TEAM_REAL_WORLD_IDENTITY_CANDIDATE": 20,
                  "TEAM_ALIAS_CANDIDATE": 1,
                  "COMPETITION_REAL_WORLD_IDENTITY_CANDIDATE": 1,
                  "FIXTURE_DUPLICATE_CANDIDATE": 4,
                  "SEASON_COVERAGE_RECONCILIATION": 1,
                  "PIT_TIMESTAMP_GAP": 1,
              }
              actual_case_counts = dict(connection.execute(
                  """
                  SELECT case_type, COUNT(*)
                  FROM veltrix_ai_analyst.canonical_identity_review_cases
                  WHERE case_key LIKE 'BRAZIL_SERIE_B_RUN_3_%'
                  GROUP BY case_type
                  """
              ).fetchall())
              if actual_case_counts != expected_case_counts:
                  raise SystemExit(
                      f"IDENTITY_REVIEW_CASE_COUNTS_MISMATCH:{actual_case_counts}"
                  )

              event_count = connection.execute(
                  """
                  SELECT COUNT(DISTINCT review_case.id)
                  FROM veltrix_ai_analyst.canonical_identity_review_case_events event
                  JOIN veltrix_ai_analyst.canonical_identity_review_cases review_case
                    ON review_case.id = event.case_id
                  WHERE review_case.case_key LIKE 'BRAZIL_SERIE_B_RUN_3_%'
                    AND event.event_type = 'AUTOMATED_RECOMMENDATION'
                    AND event.reviewer_type = 'AUTOMATED_SYSTEM'
              """
              ).fetchone()[0]
              if event_count != 28:
                  raise SystemExit(f"IDENTITY_REVIEW_RECOMMENDATION_COUNT_MISMATCH:{event_count}")

              audit_counts = connection.execute(
                  """
                  SELECT
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.canonical_team_identity_provenance_audit
                      WHERE provider='5DollarFootballAPI'
                        AND source_id='5dollarfootballapi'
                        AND provider_team_id IN (
                          '1102583842','1446563615','1548718709','1620921678','1657329649',
                          '1684426968','2016651568','2434042650','2651466053','2672186301',
                          '3007875643','3126624865','3219034225','3250670103','3324195045',
                          '3808811746','4227927162','4267737771','559667509','744720326','844813267'
                        )
                        AND source_identity_provenance_status='PROVENANCE_VERIFIED'
                    ),
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.canonical_competition_identity_provenance_audit
                      WHERE provider='5DollarFootballAPI'
                        AND source_id='5dollarfootballapi'
                        AND provider_competition_id='522514093'
                        AND source_identity_provenance_status='PROVENANCE_VERIFIED'
                    ),
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.canonical_fixture_source_provenance_audit audit
                      JOIN veltrix_ai_analyst.canonical_fixture_sources source_link
                        ON source_link.id=audit.fixture_source_link_id
                      JOIN veltrix_ai_analyst.provider_fixtures fixture
                        ON fixture.id=source_link.provider_fixture_row_id
                      WHERE fixture.provider='5DollarFootballAPI'
                        AND fixture.source_id='5dollarfootballapi'
                        AND fixture.provider_competition_id='522514093'
                        AND audit.source_fixture_provenance_status='PROVENANCE_VERIFIED'
                    ),
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.canonical_fixture_duplicate_case_audit
                      WHERE case_key LIKE 'BRAZIL_SERIE_B_RUN_3_DUPLICATE_%'
                    )
                  """
              ).fetchone()
              if audit_counts != (21, 1, 386, 4):
                  raise SystemExit(f"CANONICAL_PROVENANCE_AUDIT_COUNTS_MISMATCH:{audit_counts}")

              resolution_counts = connection.execute(
                  """
                  SELECT
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.effective_canonical_team_aliases),
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.effective_canonical_fixture_deduplication),
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.effective_canonical_identity_review_cases
                     WHERE effective_human_review_required IS TRUE)
                  """
              ).fetchone()
              if resolution_counts != (0, 0, 0):
                  raise SystemExit(f"IDENTITY_HUMAN_REVIEW_GATE_MISMATCH:{resolution_counts}")
              print("IDENTITY_REVIEW_CASES_VERIFIED: 28 Brazil Série B cases")
              print("AUTOMATED_REVIEW_GATE_VERIFIED: zero outstanding human actions")
              print("CANONICAL_PROVENANCE_AUDIT_VERIFIED: 21 Brazil teams, 1 competition, 386 fixtures")
              print("OFFICIAL_DUPLICATE_CASES_VERIFIED: 4 Brazil Série B conflicts; no canonical deduplication activated")
          PY

      - name: Verify migration 011 competition scope persistence
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import psycopg

          migration = Path("migrations/011_import_run_competition_scope.sql")
          if not migration.exists():
              raise SystemExit("MIGRATION_011_FILE_MISSING_FROM_SELECTED_REF")
          checksum = hashlib.sha256(migration.read_bytes()).hexdigest()
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              recorded = connection.execute(
                  "SELECT checksum FROM public.schema_migrations WHERE version = %s",
                  (migration.name,),
              ).fetchone()
              if recorded is None or str(recorded[0]).strip() != checksum:
                  raise SystemExit("MIGRATION_011_CHECKSUM_NOT_APPLIED")
              column = connection.execute(
                  """
                  SELECT EXISTS (
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema = 'veltrix_ai_analyst'
                        AND table_name = 'import_runs'
                        AND column_name = 'scope_value'
                  )
                  """
              ).fetchone()[0]
              if not column:
                  raise SystemExit("MIGRATION_011_SCOPE_COLUMN_MISSING")
          print(f"MIGRATION_011_VERIFIED: {checksum}")
          PY

      - name: Verify migration 015 automated identity adjudication
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import psycopg

          migration = Path("migrations/015_automated_identity_adjudication.sql")
          checksum = hashlib.sha256(migration.read_bytes()).hexdigest()
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              if connection.info.dbname != "veltrix_ai_analyst":
                  raise SystemExit("DATABASE_TARGET_NAME_MISMATCH")
              recorded = connection.execute(
                  "SELECT checksum FROM public.schema_migrations WHERE version = %s",
                  (migration.name,),
              ).fetchone()
              if recorded is None or recorded[0].strip() != checksum:
                  raise SystemExit("MIGRATION_015_CHECKSUM_NOT_APPLIED")

              columns = {
                  row[0]
                  for row in connection.execute(
                      """
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='veltrix_ai_analyst'
                        AND table_name='canonical_identity_review_case_events'
                      """
                  ).fetchall()
              }
              if not {"policy_version", "confidence", "decision_basis"} <= columns:
                  raise SystemExit("MIGRATION_015_POLICY_COLUMNS_MISSING")

              unresolved = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM veltrix_ai_analyst.effective_canonical_identity_review_cases
                  WHERE effective_human_review_required IS TRUE
                  """
              ).fetchone()[0]
              if unresolved != 0:
                  raise SystemExit(f"AUTOMATED_CASE_ADJUDICATION_INCOMPLETE:{unresolved}")

              team_verified = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM veltrix_ai_analyst.canonical_team_identity_provenance_audit
                  WHERE provider='5DollarFootballAPI'
                    AND source_id='5dollarfootballapi'
                    AND provider_team_id IN (
                      '1102583842','1446563615','1548718709','1620921678','1657329649',
                      '1684426968','2016651568','2434042650','2651466053','2672186301',
                      '3007875643','3126624865','3219034225','3250670103','3324195045',
                      '4227927162','4267737771','559667509','744720326','844813267'
                    )
                    AND real_world_identity_status='REAL_WORLD_IDENTITY_VERIFIED'
                  """
              ).fetchone()[0]
              if team_verified != 20:
                  raise SystemExit(f"CBF_TEAM_IDENTITY_VERIFICATION_COUNT:{team_verified}")

              competition_verified = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM veltrix_ai_analyst.canonical_competition_identity_provenance_audit
                  WHERE provider='5DollarFootballAPI'
                    AND source_id='5dollarfootballapi'
                    AND provider_competition_id='522514093'
                    AND real_world_identity_status='REAL_WORLD_IDENTITY_VERIFIED'
                  """
              ).fetchone()[0]
              if competition_verified != 1:
                  raise SystemExit("BRAZIL_SERIE_B_COMPETITION_IDENTITY_NOT_VERIFIED")

              auto_merges = connection.execute(
                  """
                  SELECT
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.effective_canonical_team_aliases),
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.effective_canonical_fixture_deduplication)
                  """
              ).fetchone()
              if auto_merges != (0, 0):
                  raise SystemExit(f"UNEXPECTED_AUTOMATED_CANONICAL_MERGE:{auto_merges}")

          print(f"MIGRATION_015_VERIFIED: {checksum}")
          print("AUTOMATED_IDENTITY_CASES: all evidence-disposed; no human action remains")
          print("CBF_REAL_WORLD_TEAM_IDENTITIES_VERIFIED: 20")
          print("CBF_COMPETITION_IDENTITY_VERIFIED: 1")
          print("AUTOMATIC_CANONICAL_MERGES: 0")
          PY

      - name: Verify migration 014 prediction storage and publication gate
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import psycopg

          migration = Path("migrations/014_prediction_publication_storage.sql")
          checksum = hashlib.sha256(migration.read_bytes()).hexdigest()
          tables = [
              "prediction_feature_snapshots",
              "predictions",
              "prediction_market_probabilities",
              "prediction_publication_events",
          ]
          views = [
              "published_predictions",
              "published_prediction_markets",
          ]
          functions = [
              "enforce_prediction_feature_snapshot_pit()",
              "enforce_prediction_inference_prematch()",
              "prevent_market_changes_after_publication()",
              "enforce_prediction_publish_gate()",
          ]
          triggers = [
              "prediction_feature_snapshot_pit_gate",
              "prediction_inference_prematch_gate",
              "prediction_market_publication_guard",
              "prediction_publication_gate",
              "prediction_feature_snapshots_append_only",
              "predictions_append_only",
              "prediction_market_probabilities_append_only",
              "prediction_publication_events_append_only",
          ]

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              if connection.info.dbname != "veltrix_ai_analyst":
                  raise SystemExit("DATABASE_TARGET_NAME_MISMATCH")

              recorded = connection.execute(
                  "SELECT checksum FROM public.schema_migrations WHERE version = %s",
                  (migration.name,),
              ).fetchone()
              if recorded is None or recorded[0].strip() != checksum:
                  raise SystemExit("MIGRATION_014_CHECKSUM_NOT_APPLIED")

              for relation in tables + views:
                  if connection.execute(
                      "SELECT to_regclass(%s)",
                      (f"veltrix_ai_analyst.{relation}",),
                  ).fetchone()[0] is None:
                      raise SystemExit(f"MIGRATION_014_RELATION_MISSING:{relation}")

              for function in functions:
                  if connection.execute(
                      "SELECT to_regprocedure(%s)",
                      (f"veltrix_ai_analyst.{function}",),
                  ).fetchone()[0] is None:
                      raise SystemExit(f"MIGRATION_014_FUNCTION_MISSING:{function}")

              trigger_count = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM pg_trigger trigger_row
                  JOIN pg_class relation ON relation.oid = trigger_row.tgrelid
                  JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
                  WHERE namespace.nspname = 'veltrix_ai_analyst'
                    AND NOT trigger_row.tgisinternal
                    AND trigger_row.tgname = ANY(%s)
                  """,
                  (triggers,),
              ).fetchone()[0]
              if trigger_count != len(triggers):
                  raise SystemExit("MIGRATION_014_TRIGGER_SET_INCOMPLETE")

              historical_counts = connection.execute(
                  """
                  SELECT
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.source_observations),
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.source_observation_sightings),
                    (SELECT COUNT(*) FROM veltrix_ai_analyst.provider_responses),
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.source_observations observation
                      WHERE observation.system_observed_at IS NOT NULL
                        AND EXISTS (
                          SELECT 1
                          FROM veltrix_ai_analyst.source_observation_sightings sighting
                          JOIN veltrix_ai_analyst.import_request_reservations reservation
                            ON reservation.provider_response_id=sighting.provider_response_id
                          WHERE sighting.source_observation_id=observation.id
                            AND reservation.import_run_id BETWEEN 1 AND 11
                        )
                    ),
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.source_observation_sightings sighting
                      JOIN veltrix_ai_analyst.import_request_reservations reservation
                        ON reservation.provider_response_id=sighting.provider_response_id
                      WHERE reservation.import_run_id BETWEEN 1 AND 11
                        AND sighting.system_observed_at IS NOT NULL
                    ),
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.provider_responses response
                      JOIN veltrix_ai_analyst.import_request_reservations reservation
                        ON reservation.provider_response_id=response.id
                      WHERE reservation.import_run_id BETWEEN 1 AND 11
                        AND response.system_observed_at IS NOT NULL
                    )
                  """
              ).fetchone()
              if any(actual < expected for actual, expected in zip(historical_counts[:3], (1243, 2884, 115))):
                  raise SystemExit(f"HISTORICAL_EVIDENCE_COUNT_REGRESSION:{historical_counts[:3]}")
              if historical_counts[3:] != (0, 0, 0):
                  raise SystemExit(
                      f"HISTORICAL_PIT_TIMESTAMPS_WERE_BACKFILLED:{historical_counts[3:]}"
                  )

              prospective_gaps = connection.execute(
                  """
                  SELECT
                    (
                      SELECT COUNT(*)
                      FROM veltrix_ai_analyst.source_observation_sightings sighting

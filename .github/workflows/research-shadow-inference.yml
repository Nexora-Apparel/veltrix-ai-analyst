name: VELTRIX Stage 7 research shadow inference (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_research_ledger_write:
        description: Explicitly authorize writing this run to the isolated research ledger
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veltrix-stage7-shadow-inference
  cancel-in-progress: false

jobs:
  infer:
    if: inputs.confirm_research_ledger_write == true
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELTRIX_AI_ANALYST_DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e .
      - name: Build selected Stage 7 shadow forecasts (read-only)
        run: |
          mkdir -p artifacts
          python scripts/build_stage7_shadow_predictions.py --output artifacts/stage7-shadow-report.json --max-fixtures 25 --max-snapshot-age-hours 6
      - name: Persist to isolated research ledger (explicit manual dispatch only)
        env:
          VELTRIX_SHADOW_LEDGER_WRITE_ENABLED: "true"
          VELTRIX_SHADOW_LEDGER_DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
        run: |
          python scripts/persist_prospective_shadow_forecasts.py --report artifacts/stage7-shadow-report.json --code-commit "$GITHUB_SHA" --confirm-research-ledger-write
      - name: Upload sanitized run summary
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # actions/upload-artifact@v4
        with:
          name: veltrix-stage7-shadow-run-summary
          path: |
            backend/artifacts/stage7-shadow-report.json
            backend/artifacts/stage7-shadow-sanitized-summary.json
          if-no-files-found: warn
          retention-days: 30

name: 5Dollar competition-scoped historical import

on:
  workflow_dispatch:
    inputs:
      competition_id:
        description: Approved 5Dollar competition ID (one competition per run)
        required: true
        type: choice
        options:
          - "3118717965"
          - "4160026622"
          - "3614399544"
          - "686337048"
          - "3405541143"
          - "4212821298"
      start_at:
        description: Inclusive UTC ISO-8601 boundary
        required: true
        default: "2026-08-20T00:00:00+00:00"
        type: string
      end_at:
        description: Exclusive UTC ISO-8601 boundary
        required: true
        default: "2026-11-18T00:00:00+00:00"
        type: string
      request_budget:
        description: Maximum provider requests reserved for this competition
        required: true
        default: "20"
        type: choice
        options: ["13", "15", "20", "30", "40"]

permissions:
  contents: read

concurrency:
  group: veltrix-5dollar-historical-import
  cancel-in-progress: false

jobs:
  import-one-competition:
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY || secrets.FIVEDOLLARFOOTBALL_API_KEY || secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
      VELTRIX_ENABLE_HISTORICAL_COLLECTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Validate dedicated database configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY"
          python -c "from urllib.parse import urlsplit; import os; assert urlsplit(os.environ['DATABASE_URL']).path.lstrip('/').split('?')[0] == 'veltrix_ai_analyst'"
      - name: Require competition-scope migration before collection
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              if connection.info.dbname != "veltrix_ai_analyst":
                  raise SystemExit("DATABASE_TARGET_NAME_MISMATCH")
              exists = connection.execute(
                  """
                  SELECT EXISTS (
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema = 'veltrix_ai_analyst'
                        AND table_name = 'import_runs'
                        AND column_name = 'scope_value'
                  )
                  """
              ).fetchone()[0]
              if not exists:
                  raise SystemExit("MIGRATION_011_REQUIRED_BEFORE_COMPETITION_IMPORT")
              timestamps = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM information_schema.columns
                  WHERE table_schema='veltrix_ai_analyst'
                    AND column_name='system_observed_at'
                    AND table_name IN (
                      'provider_responses',
                      'source_observations',
                      'source_observation_sightings'
                    )
                  """
              ).fetchone()[0]
              applied = connection.execute(
                  """
                  SELECT EXISTS (
                    SELECT 1 FROM public.schema_migrations
                    WHERE version='012_database_observed_timestamps.sql'
                  )
                  """
              ).fetchone()[0]
              if timestamps != 3 or not applied:
                  raise SystemExit("MIGRATION_012_REQUIRED_BEFORE_SYSTEM_OBSERVED_COLLECTION")
          PY
      - name: Import one approved competition with durable request reservations
        working-directory: backend
        run: |
          python ../scripts/collect_5dollar_competition_history.py \
            --competition-id "${{ inputs.competition_id }}" \
            --start-at "${{ inputs.start_at }}" \
            --end-at "${{ inputs.end_at }}" \
            --request-budget "${{ inputs.request_budget }}" \
            --execute

name: Brazil Serie B Historical Import Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-brazil-serie-b-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: veltrix-historical-import
    env:
      VELTRIX_AI_ANALYST_DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e backend
      - name: Verify dedicated database and collection prerequisites
        run: python scripts/preflight_brazil_serie_b_history.py

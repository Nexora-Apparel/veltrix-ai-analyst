name: Stage 7 prospective research evaluation and certification gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-7-prospective-research-evaluation.yml'
  workflow_run:
    workflows: ["Stage 6 daily immutable snapshot and outcome materialization"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: veltrix-stage7-prospective-research
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e .

      - name: Run read-only expanding-window research evaluation
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python scripts/evaluate_prospective_hierarchical.py \
            --output artifacts/prospective-model-evaluation.json \
            --dataset-output artifacts/prospective-dataset.json \
            --bootstrap-replicates 200

      - name: Apply independent production certification gates
        run: |
          PYTHONPATH=. python scripts/apply_prospective_certification_gates.py \
            --evaluation artifacts/prospective-model-evaluation.json \
            --dataset artifacts/prospective-dataset.json

      - name: Upload chronological evaluation and certification gate
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-stage7-prospective-research-evaluation
          path: |
            backend/artifacts/prospective-model-evaluation.json
            backend/artifacts/prospective-dataset.json
          if-no-files-found: error
          retention-days: 90

name: 5Dollar all-approved competitions historical and prospective batch

on:
  workflow_dispatch:
    inputs:
      start_at:
        description: Inclusive UTC ISO-8601 boundary
        required: true
        type: string
        default: "2026-08-20T00:00:00+00:00"
      end_at:
        description: Exclusive UTC ISO-8601 boundary
        required: true
        type: string
        default: "2026-11-18T00:00:00+00:00"
      request_budget:
        description: Maximum provider requests per competition (seven competitions; maximum 280 total)
        required: true
        type: choice
        default: "20"
        options: ["10", "13", "15", "20", "30", "40"]

permissions:
  contents: read

concurrency:
  group: veltrix-5dollar-historical-import
  cancel-in-progress: false

jobs:
  import-approved-competitions:
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY || secrets.FIVEDOLLARFOOTBALL_API_KEY || secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
      VELTRIX_ENABLE_HISTORICAL_COLLECTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Validate dedicated database and migration
        run: |
          test -n "$DATABASE_URL"
          test -n "$FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY"
          python - <<'PY'
          import os
          import psycopg
          from urllib.parse import urlsplit
          assert urlsplit(os.environ["DATABASE_URL"]).path.lstrip("/").split("?")[0] == "veltrix_ai_analyst"
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              assert connection.info.dbname == "veltrix_ai_analyst"
              exists = connection.execute("""
                  SELECT EXISTS (
                    SELECT 1 FROM information_schema.columns
                    WHERE table_schema='veltrix_ai_analyst'
                      AND table_name='import_runs' AND column_name='scope_value'
                  )
              """).fetchone()[0]
              if not exists:
                  raise SystemExit("MIGRATION_011_REQUIRED_BEFORE_BATCH_COLLECTION")
              timestamps = connection.execute("""
                  SELECT COUNT(*)
                  FROM information_schema.columns
                  WHERE table_schema='veltrix_ai_analyst'
                    AND column_name='system_observed_at'
                    AND table_name IN (
                      'provider_responses',
                      'source_observations',
                      'source_observation_sightings'
                    )
              """).fetchone()[0]
              applied = connection.execute("""
                  SELECT EXISTS (
                    SELECT 1 FROM public.schema_migrations
                    WHERE version='012_database_observed_timestamps.sql'
                  )
              """).fetchone()[0]
              if timestamps != 3 or not applied:
                  raise SystemExit("MIGRATION_012_REQUIRED_BEFORE_SYSTEM_OBSERVED_COLLECTION")
          PY
      - name: Collect all approved competitions sequentially
        working-directory: backend
        run: |
          python ../scripts/collect_5dollar_all_approved_competitions.py \
            --start-at "${{ inputs.start_at }}" \
            --end-at "${{ inputs.end_at }}" \
            --request-budget "${{ inputs.request_budget }}" \
            --execute

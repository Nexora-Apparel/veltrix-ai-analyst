name: Verify CBF Série B rounds 33–36 results

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cbf-rounds-33-36-score-verification.yml"
      - "backend/scripts/verify_cbf_rounds_33_36_results.py"
      - "backend/data/research/cbf_round33_36_official_results.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-ai-analyst-cbf-score-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: veltrix-historical-import
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      CBF_ROUNDS_33_36_SCORE_VERIFICATION_PATH: artifacts/cbf-rounds-33-36-score-verification.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install read-only audit dependencies
        run: python -m pip install -e .
      - name: Compare official CBF rounds 33-36 results with immutable provider fixtures
        run: python scripts/verify_cbf_rounds_33_36_results.py
      - name: Upload rounds 33-36 score verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: cbf-rounds-33-36-score-verification
          path: backend/artifacts/cbf-rounds-33-36-score-verification.json
          if-no-files-found: error
          retention-days: 30

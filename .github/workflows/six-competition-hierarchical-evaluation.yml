name: Six-competition hierarchical retrospective evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_evaluation:
        description: Type RUN_SIX_COMPETITION_RETROSPECTIVE_EVALUATION to run read-only tuning and holdout comparison
        required: true
        type: choice
        options:
          - NO
          - RUN_SIX_COMPETITION_RETROSPECTIVE_EVALUATION
        default: NO

permissions:
  contents: read

concurrency:
  group: veltrix-six-competition-hierarchical-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: inputs.confirm_evaluation == 'RUN_SIX_COMPETITION_RETROSPECTIVE_EVALUATION'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: veltrix-historical-import
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      TRAINING_REPORT_PATH: artifacts/six-competition-hierarchical-report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e .
      - name: Run read-only chronological hierarchical evaluation
        run: python scripts/evaluate_six_competition_hierarchical.py
      - name: Upload immutable research report
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-six-competition-hierarchical-report
          path: backend/artifacts/six-competition-hierarchical-report.json
          if-no-files-found: error
          retention-days: 90

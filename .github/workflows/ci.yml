name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "backend/tests/test_the_odds_api_markets.py"
      - "android/**"
      - "scripts/verify_5dollar_access.py"
      - "scripts/collect_aimidas_brazil_serie_b_snapshot.py"
      - "scripts/apply_migrations.py"
      - "scripts/collect_brazil_serie_b_history.py"
      - "scripts/validate_brazil_serie_b_import.py"
      - "scripts/probe_5dollar_odds_snapshot.py"
      - "scripts/probe_the_odds_api_catalogue.py"
      - ".github/workflows/the-odds-api-catalogue-probe.yml"
      - "scripts/probe_the_odds_api_catalogue.py"
      - "scripts/probe_the_odds_api_events.py"
      - "scripts/probe_5dollar_scheduled_fixtures.py"
      - "scripts/reconcile_odds_api_event_catalogue.py"
      - "scripts/probe_the_odds_api_event_h2h.py"
      - ".github/workflows/the-odds-api-catalogue-probe.yml"
      - ".github/workflows/the-odds-api-5dollar-fixture-qualification.yml"
      - ".github/workflows/the-odds-api-event-discovery.yml"
      - ".github/workflows/5dollar-odds-snapshot-probe.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/apply-database-migrations.yml"
      - ".github/workflows/materialize-canonical-entities.yml"
      - ".github/workflows/materialize-round38-canonical-incremental.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "android/**"
      - "scripts/collect_brazil_serie_b_history.py"
      - "scripts/probe_5dollar_odds_snapshot.py"
      - "scripts/probe_the_odds_api_events.py"
      - "scripts/probe_5dollar_scheduled_fixtures.py"
      - "scripts/reconcile_odds_api_event_catalogue.py"
      - "scripts/probe_the_odds_api_event_h2h.py"
      - ".github/workflows/the-odds-api-event-discovery.yml"
      - ".github/workflows/the-odds-api-5dollar-fixture-qualification.yml"
      - ".github/workflows/5dollar-odds-snapshot-probe.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/apply-database-migrations.yml"
      - ".github/workflows/materialize-canonical-entities.yml"
      - ".github/workflows/materialize-round38-canonical-incremental.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veltrix_test
      EXPECTED_DATABASE_NAME: veltrix_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run lint
        run: ruff check app tests ../scripts/verify_5dollar_access.py ../scripts/collect_aimidas_brazil_serie_b_snapshot.py ../scripts/apply_migrations.py ../scripts/collect_brazil_serie_b_history.py ../scripts/validate_brazil_serie_b_import.py ../scripts/probe_5dollar_odds_snapshot.py ../scripts/probe_the_odds_api_catalogue.py ../scripts/probe_the_odds_api_events.py ../scripts/probe_5dollar_scheduled_fixtures.py ../scripts/reconcile_odds_api_event_catalogue.py ../scripts/probe_the_odds_api_event_h2h.py scripts/preview_canonical_materialization.py scripts/materialize_canonical_entities.py scripts/materialize_round38_incremental.py scripts/verify_cbf_scores_rounds_1_29.py scripts/verify_cbf_round38_results.py scripts/verify_cbf_round30_results.py scripts/verify_cbf_rounds_33_36_results.py

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-ai-analyst-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

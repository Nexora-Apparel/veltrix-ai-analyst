name: 5Dollar single-fixture odds snapshot probe

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: Existing 5Dollar provider fixture ID (one request only)
        required: true
        default: "1194891794"
        type: string

permissions:
  contents: read

jobs:
  bounded-odds-probe:
    name: One-request odds snapshot probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY || secrets.FIVEDOLLARFOOTBALL_API_KEY || secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
      ODDS_PROBE_FIXTURE_ID: ${{ inputs.fixture_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run one-request odds probe
        run: python scripts/probe_5dollar_odds_snapshot.py
      - name: Upload compact odds probe manifest
        if: always() && hashFiles('probe-artifact/odds-snapshot-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 5dollar-odds-snapshot-probe
          path: probe-artifact/odds-snapshot-manifest.json
          retention-days: 7

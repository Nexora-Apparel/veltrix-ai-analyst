name: Corrected shrinkage audit

on:
  workflow_dispatch:
    inputs:
      stage6_run_id:
        description: Pinned Stage 6 workflow run ID
        required: true
        default: "44873016040"
        type: string
      stage6_artifact_id:
        description: Pinned Stage 6 artifact ID
        required: true
        default: "14694463354"
        type: string
      forecast_run_id:
        description: Pinned forecast workflow run ID
        required: true
        default: "44873166128"
        type: string
      forecast_artifact_id:
        description: Pinned forecast artifact ID
        required: true
        default: "14694089682"
        type: string
      audit_commit_sha:
        description: Exact PR merge commit SHA already on main (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start audit timer
        id: audit_clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact merged audit commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4
        with:
          ref: ${{ inputs.audit_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact audit commit is on main
        env:
          AUDIT_COMMIT_SHA: ${{ inputs.audit_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "AUDIT_COMMIT_SHA_MUST_BE_40_LOWERCASE_HEX" >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$AUDIT_COMMIT_SHA" origin/main || {
            echo "AUDIT_COMMIT_NOT_ON_MAIN" >&2
            exit 1
          }
          test -f backend/app/research/corrected_shrinkage_audit.py || {
            echo "AUDIT_IMPLEMENTATION_MISSING" >&2
            exit 1
          }

      - name: Download and verify exact source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE6_RUN: ${{ inputs.stage6_run_id }}
          STAGE6_ARTIFACT: ${{ inputs.stage6_artifact_id }}
          FORECAST_RUN: ${{ inputs.forecast_run_id }}
          FORECAST_ARTIFACT: ${{ inputs.forecast_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/veltrix-audit/stage6 /tmp/veltrix-audit/forecast
          gh api "/repos/$GH_REPO/actions/runs/$STAGE6_RUN/artifacts" > /tmp/stage6-artifacts.json
          gh api "/repos/$GH_REPO/actions/runs/$FORECAST_RUN/artifacts" > /tmp/forecast-artifacts.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = (
              (Path("/tmp/stage6-artifacts.json"), os.environ["STAGE6_ARTIFACT"],
               "veltrix-stage6-daily-materialization-audit"),
              (Path("/tmp/forecast-artifacts.json"), os.environ["FORECAST_ARTIFACT"],
               "veltrix-prospective-shadow-forecasts"),
          )
          for metadata_path, artifact_id, expected_name in expected:
              payload = json.loads(metadata_path.read_text(encoding="utf-8"))
              matches = [item for item in payload.get("artifacts", [])
                         if str(item.get("id")) == artifact_id]
              if len(matches) != 1:
                  raise SystemExit(f"ARTIFACT_ID_NOT_UNIQUE:{artifact_id}")
              item = matches[0]
              if item.get("name") != expected_name or item.get("expired"):
                  raise SystemExit(f"ARTIFACT_NAME_OR_EXPIRY_MISMATCH:{artifact_id}")
          PY
          gh api "/repos/$GH_REPO/actions/artifacts/$STAGE6_ARTIFACT/zip" > /tmp/stage6.zip
          gh api "/repos/$GH_REPO/actions/artifacts/$FORECAST_ARTIFACT/zip" > /tmp/forecast.zip
          sha256sum /tmp/stage6.zip /tmp/forecast.zip | tee /tmp/source-zip-hashes.txt
          echo "ZIP byte SHA-256 values are recorded only; content fingerprints remain fatal."
          unzip -tq /tmp/stage6.zip
          unzip -tq /tmp/forecast.zip
          unzip -q /tmp/stage6.zip -d /tmp/veltrix-audit/stage6
          unzip -q /tmp/forecast.zip -d /tmp/veltrix-audit/forecast
          test -f /tmp/veltrix-audit/stage6/prospective-dataset.json
          test -f /tmp/veltrix-audit/forecast/prospective-shadow-forecasts.json
          test "$(find /tmp/veltrix-audit/stage6 -type f -name '*.json' | wc -l)" -eq 1
          test "$(find /tmp/veltrix-audit/forecast -type f -name '*.json' | wc -l)" -eq 1

      - name: Install the same backend dev dependency set as CI
        run: python -m pip install --disable-pip-version-check -e "backend[dev]"

      - name: Run audit tests and import-isolation checks
        working-directory: backend
        run: python -m pytest -q tests/test_corrected_shrinkage_audit.py tests/test_shadow_model_audit.py

      - name: Verify source fingerprints and generate allowlisted sanitized report
        env:
          AUDIT_COMMIT_SHA: ${{ inputs.audit_commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stage6_path = Path("/tmp/veltrix-audit/stage6/prospective-dataset.json")
          forecast_path = Path("/tmp/veltrix-audit/forecast/prospective-shadow-forecasts.json")
          dataset = json.loads(stage6_path.read_text(encoding="utf-8"))
          forecast = json.loads(forecast_path.read_text(encoding="utf-8"))
          if dataset.get("dataset_sha256") != "80148b3f0f42e70d94391d9283c42f35b5b92e1631a9a1cb7baee899373dad0c":
              raise SystemExit("DATASET_SHA_MISMATCH")
          if forecast.get("dataset_sha256") != dataset.get("dataset_sha256"):
              raise SystemExit("FORECAST_DATASET_SHA_MISMATCH")
          from app.research.shadow_model_audit import training_data_sha256
          training_sha = training_data_sha256(dataset["training_only_rows"])
          if training_sha != "d70ee34940c8fc6681f3cd5751d4fdcc2e876b307fe388d9f3a792c73e34b262":
              raise SystemExit("TRAINING_SHA_MISMATCH")
          if forecast.get("training_data_sha256") != training_sha:
              raise SystemExit("FORECAST_TRAINING_SHA_MISMATCH")
          from app.research.corrected_shrinkage_audit import (
              run_audit, sanitize_audit_report,
          )
          report = run_audit(
              dataset, forecast, commit_sha=os.environ["AUDIT_COMMIT_SHA"]
          )
          sanitized = sanitize_audit_report(report)
          Path("sanitized-audit.json").write_text(
              json.dumps(sanitized, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload sanitized JSON only
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # actions/upload-artifact@v4
        with:
          name: veltrix-corrected-shrinkage-audit-json
          path: sanitized-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Report elapsed audit time
        if: always()
        env:
          STARTED_AT: ${{ steps.audit_clock.outputs.started_at }}
        run: |
          if [[ -n "$STARTED_AT" ]]; then
            echo "Elapsed audit seconds: $(( $(date +%s) - STARTED_AT ))"
          fi

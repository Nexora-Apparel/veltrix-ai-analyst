name: Effective shrinkage audit

on:
  workflow_dispatch:
    inputs:
      stage6_run_id:
        description: Pinned Stage 6 workflow run ID
        required: true
        default: "44873016040"
        type: string
      stage6_artifact_id:
        description: Pinned Stage 6 artifact ID
        required: true
        default: "14694463354"
        type: string
      forecast_run_id:
        description: Pinned forecast workflow run ID
        required: true
        default: "44873166128"
        type: string
      forecast_artifact_id:
        description: Pinned forecast artifact ID
        required: true
        default: "14694089682"
        type: string
      audit_commit_sha:
        description: Exact merged audit code commit SHA
        required: true
        default: "d1c55fffe078ebf78910ea75195083984f079a15"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.audit_commit_sha }}
          persist-credentials: false
      - name: Download pinned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE6_RUN: ${{ inputs.stage6_run_id }}
          STAGE6_ARTIFACT: ${{ inputs.stage6_artifact_id }}
          FORECAST_RUN: ${{ inputs.forecast_run_id }}
          FORECAST_ARTIFACT: ${{ inputs.forecast_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/veltrix-audit/stage6 /tmp/veltrix-audit/forecast
          gh api "/repos/$GH_REPO/actions/runs/$STAGE6_RUN/artifacts" --jq ".artifacts[].id" | grep -Fx "$STAGE6_ARTIFACT"
          gh api "/repos/$GH_REPO/actions/artifacts/$STAGE6_ARTIFACT/zip" > /tmp/stage6.zip
          gh api "/repos/$GH_REPO/actions/runs/$FORECAST_RUN/artifacts" --jq ".artifacts[].id" | grep -Fx "$FORECAST_ARTIFACT"
          gh api "/repos/$GH_REPO/actions/artifacts/$FORECAST_ARTIFACT/zip" > /tmp/forecast.zip
          echo "$STAGE6_RUN $STAGE6_ARTIFACT" > /tmp/veltrix-audit/stage6/source.txt
          echo "$FORECAST_RUN $FORECAST_ARTIFACT" > /tmp/veltrix-audit/forecast/source.txt
          echo "3a2ebfb7dd94899bc1cf5000bb365c440753afcfa474869a733bbeeda0a1ad81  /tmp/stage6.zip" | sha256sum -c -
          echo "44164d6e9ead148b6fa0e663f81bde18ad5f75e839143e408a2ecce98cc7f16f  /tmp/forecast.zip" | sha256sum -c -
          unzip -q /tmp/stage6.zip -d /tmp/veltrix-audit/stage6
          unzip -q /tmp/forecast.zip -d /tmp/veltrix-audit/forecast
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -e backend
      - name: Run import isolation and audit tests
        working-directory: backend
        run: python -m pytest -q tests/test_corrected_shrinkage_audit.py tests/test_shadow_model_audit.py
      - name: Verify canonical hashes before computation and generate sanitized report
        env:
          AUDIT_COMMIT_SHA: ${{ inputs.audit_commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          roots=[pathlib.Path('/tmp/veltrix-audit/stage6'),pathlib.Path('/tmp/veltrix-audit/forecast')]
          files=[p for root in roots for p in root.rglob('*.json')]
          if len(files)<2: raise SystemExit('EXPECTED_ARTIFACT_JSON_FILES_NOT_FOUND')
          dataset=next((json.loads(p.read_text()) for p in files if json.loads(p.read_text()).get('report_type')=='VELTRIX_PROSPECTIVE_EXPANDING_DATASET'),None)
          forecast=next((json.loads(p.read_text()) for p in files if isinstance(json.loads(p.read_text()).get('predictions'),list)),None)
          if dataset is None or forecast is None: raise SystemExit('PINNED_JSON_PAYLOAD_NOT_FOUND')
          from app.research.shadow_model_audit import training_data_sha256
          if dataset.get('dataset_sha256')!='80148b3f0f42e70d94391d9283c42f35b5b92e1631a9a1cb7baee899373dad0c': raise SystemExit('DATASET_SHA_MISMATCH')
          if training_data_sha256(dataset['training_only_rows'])!='d70ee34940c8fc6681f3cd5751d4fdcc2e876b307fe388d9f3a792c73e34b262': raise SystemExit('TRAINING_SHA_MISMATCH')
          from app.research.corrected_shrinkage_audit import run_audit
          report=run_audit(dataset,forecast,commit_sha=__import__('os').environ['AUDIT_COMMIT_SHA'])
          pathlib.Path('sanitized-audit.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\
')
          PY
      - name: Upload sanitized JSON only
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: veltrix-corrected-shrinkage-audit-json
          path: sanitized-audit.json
          if-no-files-found: error
          retention-days: 90

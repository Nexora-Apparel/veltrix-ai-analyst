name: 5Dollar provider access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-provider-access:
    name: Verify 5Dollar plan and Brazil competition access
    runs-on: ubuntu-latest
    env:
      FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVEDOLLARFOOTBALL_COMMUNITY_API_KEY || secrets.FIVEDOLLARFOOTBALL_API_KEY || secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e "backend"
      - name: Verify provider access
        run: python scripts/verify_5dollar_access.py

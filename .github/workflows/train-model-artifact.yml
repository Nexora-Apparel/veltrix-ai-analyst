name: Train private research model artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "training/run-model-*"
    paths:
      - "backend/app/research/train_final_model.py"
      - "backend/app/models/**"
      - "backend/migrations/008_model_artifacts.sql"
      - ".github/workflows/train-model-artifact.yml"

permissions:
  contents: read

concurrency:
  group: veltrix-ai-analyst-model-training
  cancel-in-progress: false

jobs:
  train:
    name: Fit and persist private model artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      ALLOW_REMOTE_MIGRATIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e .
      - name: Apply checksum-verified database migrations
        run: python ../scripts/apply_migrations.py
      - name: Run expanding chronological evaluation
        run: python -m app.research.retrospective_run --output /tmp/veltrix-retrospective-report.json
      - name: Fit and persist immutable research artifact
        run: python -m app.research.train_final_model

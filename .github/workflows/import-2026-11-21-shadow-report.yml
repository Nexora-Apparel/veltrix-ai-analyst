name: Import verified 21 November shadow forecasts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-2026-11-21-shadow-report.yml"

permissions:
  actions: read
  contents: read

jobs:
  import-research-report:
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .

      - name: Download the verified 21 November shadow artifact
        uses: actions/download-artifact@v4
        with:
          name: veltrix-prospective-shadow-forecasts
          path: backend/artifacts
          repository: Nexora-Apparel/veltrix-ai-analyst
          run-id: 44873166128
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and persist to isolated research ledger
        working-directory: backend
        env:
          VELTRIX_SHADOW_LEDGER_WRITE_ENABLED: "true"
          VELTRIX_SHADOW_LEDGER_DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
        run: |
          python scripts/persist_prospective_shadow_forecasts.py \
            --report artifacts/prospective-shadow-forecasts.json \
            --code-commit 5735b4126ea228c078d60af18e5b5b97dd6f86ca \
            --confirm-research-ledger-write

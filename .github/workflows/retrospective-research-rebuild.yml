name: Rebuild retrospective research report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrospective-research-rebuild.yml"
      - "backend/data/research/official_kickoff_adjudications.json"
      - "backend/scripts/train_retrospective_research.py"
      - "backend/scripts/evaluate_paired_chronological.py"

permissions:
  contents: read

concurrency:
  group: veltrix-ai-analyst-retrospective-research
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: veltrix-historical-import
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      TRAINING_REPORT_PATH: artifacts/retrospective-training-report.json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install research runner
        run: python -m pip install -e .
      - name: Validate completed historical feature imports (read-only)
        run: python scripts/validate_historical_feature_backfill.py
      - name: Build statistics-aware retrospective feature dataset (read-only)
        run: python -m app.research.retrospective_feature_dataset --output-dir artifacts/retrospective-feature-dataset
      - name: Rebuild from read-only historical corpus
        run: python scripts/train_retrospective_research.py
      - name: Run paired chronological diagnostics
        run: python scripts/evaluate_paired_chronological.py --input artifacts/retrospective-training-report.json --output artifacts/paired-chronological-diagnostics.json --resamples 2000 --block-size 20 --seed 20261118
      - name: Upload statistics-aware feature dataset
        uses: actions/upload-artifact@v4
        with:
          name: statistics-aware-retrospective-feature-dataset
          path: backend/artifacts/retrospective-feature-dataset/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload paired diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: corrected-paired-chronological-diagnostics
          path: backend/artifacts/paired-chronological-diagnostics.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload corrected report
        uses: actions/upload-artifact@v4
        with:
          name: corrected-retrospective-research-report
          path: backend/artifacts/retrospective-training-report.json
          if-no-files-found: error
          retention-days: 30

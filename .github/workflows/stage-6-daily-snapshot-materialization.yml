name: Stage 6 daily immutable snapshot and outcome materialization

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VELTRIX prospective 5Dollar evidence capture"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: veltrix-stage6-daily-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) || (
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      VELTRIX_AI_ANALYST_DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e .

      - name: Materialize and adjudicate exact source-local fixture links
        env:
          VELTRIX_DAILY_CANONICALIZATION_CONFIRMATION: RUN_DAILY_EXACT_SOURCE_FIXTURE_LINK_ADJUDICATION_V1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/materialize_and_adjudicate_daily_fixtures.py \
            | tee artifacts/canonical-fixture-linkage.json

      - name: Build canonical identity and strict PIT dataset (read only)
        run: |
          mkdir -p artifacts
          python scripts/build_prospective_dataset.py \
            --output artifacts/prospective-dataset.json

      - name: Enforce closed release gates and validate immutable snapshot payload
        run: |
          python scripts/materialize_prospective_snapshots.py \
            --input artifacts/prospective-dataset.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/prospective-dataset.json").read_text()
          )
          if report["eligible_prospective_rows"] < 1:
              raise SystemExit("NO_ELIGIBLE_PROSPECTIVE_SNAPSHOTS")
          if report["release_eligible"] is not False:
              raise SystemExit("RELEASE_GATE_MUST_REMAIN_CLOSED")
          if report["production_promotion"] != "LOCKED":
              raise SystemExit("PRODUCTION_PROMOTION_MUST_REMAIN_LOCKED")
          if report["value_betting"] != "LOCKED":
              raise SystemExit("VALUE_BETTING_MUST_REMAIN_LOCKED")
          if report["invalid_system_observed_sightings"] != 0:
              raise SystemExit("INVALID_SYSTEM_OBSERVED_SIGHTINGS_PRESENT")
          rows = report["rows"]
          keys = [
              (row["canonical_fixture_id"], row["prediction_cutoff_at"])
              for row in rows
          ]
          if len(keys) != len(set(keys)):
              raise SystemExit("DUPLICATE_CANONICAL_SNAPSHOT_KEYS")
          print(json.dumps({
              "eligible_rows": len(rows),
              "settled_label_rows": report["settled_label_rows"],
              "unsettled_rows": report["unsettled_rows"],
              "feature_lineage_records": report["feature_lineage_records"],
              "dataset_sha256": report["dataset_sha256"],
              "release_eligible": report["release_eligible"],
              "production_promotion": report["production_promotion"],
              "value_betting": report["value_betting"],
          }, sort_keys=True))
          PY

      - name: Persist immutable snapshots and append-only outcomes
        run: |
          python scripts/materialize_prospective_snapshots.py \
            --input artifacts/prospective-dataset.json \
            --confirm-persist

      # Preserve the exact read-only dataset even when immutable persistence fails.
      # This is required to diagnose key collisions without rebuilding a different PIT view.
      - name: Upload Stage 6 diagnostic dataset and lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-stage6-diagnostic-dataset
          path: |
            backend/artifacts/prospective-dataset.json
            backend/artifacts/canonical-fixture-linkage.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify persisted snapshots and exact latest label events
        id: verify
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg

          report = json.loads(
              Path("artifacts/prospective-dataset.json").read_text()
          )
          expected_rows = json.dumps([
              {
                  "canonical_fixture_id": item["canonical_fixture_id"],
                  "prediction_cutoff_at": item["prediction_cutoff_at"],
                  "label_observation_id": item.get("label_observation_id"),
              }
              for item in report["rows"]
          ])
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              if connection.info.dbname != "veltrix_ai_analyst":
                  raise SystemExit("DATABASE_TARGET_NAME_MISMATCH")
              counts = connection.execute(
                  """
                  WITH expected AS (
                      SELECT *
                      FROM jsonb_to_recordset(%s::jsonb) AS item(
                          canonical_fixture_id UUID,
                          prediction_cutoff_at TIMESTAMPTZ,
                          label_observation_id BIGINT
                      )
                  )
                  SELECT COUNT(s.id), COUNT(DISTINCT s.canonical_fixture_id),
                         COUNT(l.id)
                  FROM expected e
                  LEFT JOIN veltrix_ai_analyst.prospective_feature_snapshots s
                    ON s.canonical_fixture_id=e.canonical_fixture_id
                   AND s.prediction_cutoff_at=e.prediction_cutoff_at
                   AND s.feature_schema_version='veltrix-pit-features-v1'
                  LEFT JOIN veltrix_ai_analyst.prospective_feature_snapshot_labels l
                    ON l.snapshot_id=s.id
                   AND l.source_observation_id=e.label_observation_id
                  """,
                  (expected_rows,),
              ).fetchone()
              if counts[0] != report["eligible_prospective_rows"]:
                  raise SystemExit("SNAPSHOT_PERSISTENCE_COUNT_MISMATCH")
              if counts[1] != report["eligible_prospective_rows"]:
                  raise SystemExit("SNAPSHOT_FIXTURE_IDENTITY_COUNT_MISMATCH")
              if counts[2] != report["settled_label_rows"]:
                  raise SystemExit("APPEND_ONLY_LABEL_COUNT_MISMATCH")
              snapshot_trigger = connection.execute(
                  """
                  SELECT t.tgenabled, p.proname
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid=t.tgrelid
                  JOIN pg_namespace n ON n.oid=c.relnamespace
                  JOIN pg_proc p ON p.oid=t.tgfoid
                  WHERE n.nspname='veltrix_ai_analyst'
                    AND c.relname='prospective_feature_snapshots'
                    AND t.tgname='prospective_feature_snapshots_append_only'
                    AND NOT t.tgisinternal
                  """
              ).fetchone()
              if (
                  snapshot_trigger is None
                  or snapshot_trigger[0] not in ("O", "A")
                  or snapshot_trigger[1] != "reject_prospective_snapshot_mutation"
              ):
                  raise SystemExit("SNAPSHOT_APPEND_ONLY_TRIGGER_NOT_ACTIVE")
              label_trigger_count = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid=t.tgrelid
                  JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE n.nspname='veltrix_ai_analyst'
                    AND c.relname='prospective_feature_snapshot_labels'
                    AND t.tgname IN (
                        'prospective_snapshot_label_pit_guard',
                        'prospective_snapshot_labels_append_only'
                    )
                    AND t.tgenabled IN ('O', 'A')
                    AND NOT t.tgisinternal
                  """
              ).fetchone()[0]
              if label_trigger_count != 2:
                  raise SystemExit("APPEND_ONLY_LABEL_GUARDS_NOT_ACTIVE")
          print(json.dumps({
              "status": "DAILY_MATERIALIZATION_VERIFIED",
              "snapshots": counts[0],
              "distinct_fixtures": counts[1],
              "latest_label_events": counts[2],
              "dataset_sha256": report["dataset_sha256"],
          }, sort_keys=True))
          PY

      - name: Report Stage 6 completion and capture timing
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          capture_id="${{ github.event.workflow_run.id }}"
          capture_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$capture_id")
          capture_created=$(echo "$capture_json" | jq -r '.created_at')
          capture_started=$(echo "$capture_json" | jq -r '.run_started_at // "not-started"')
          capture_conclusion=$(echo "$capture_json" | jq -r '.conclusion // "pending"')
          stage6_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          stage6_created=$(echo "$stage6_json" | jq -r '.created_at')
          stage6_started=$(echo "$stage6_json" | jq -r '.run_started_at // "not-started"')
          materialize_outcome="${{ steps.verify.outcome }}"
          {
            echo "### Stage 6 timing and outcome"
            echo "- Capture run ID: $capture_id"
            echo "- Capture created: $capture_created"
            echo "- Capture started: $capture_started"
            echo "- Capture conclusion: $capture_conclusion"
            echo "- Stage 6 created: $stage6_created"
            echo "- Stage 6 started: $stage6_started"
            echo "- Stage 6 verification step: $materialize_outcome"
            echo "- Stage 6 run ID: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

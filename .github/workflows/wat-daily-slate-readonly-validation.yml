name: VELTRIX read-only WAT daily slate candidate validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA from the WAT correction candidate branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: veltrix-wat-readonly-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    environment: veltrix-historical-import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELTRIX_AI_ANALYST_DATABASE_URL: ${{ secrets.VELTRIX_AI_ANALYST_DATABASE_URL }}
      EXPECTED_DATABASE_NAME: veltrix_ai_analyst
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Validate exact candidate SHA input
        shell: bash
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify checked-out candidate SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$CANDIDATE_SHA" ]]; then
            echo "Candidate SHA mismatch: expected $CANDIDATE_SHA, got $actual" >&2
            exit 1
          fi
          echo "Validated candidate commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run read-only candidate WAT slate validation
        run: |
          mkdir -p artifacts
          python scripts/validate_stage7_wat_daily_slate.py \
            --output artifacts/wat-daily-slate-readonly-validation.json \
            --max-fixtures 25 \
            --max-snapshot-age-hours 6

      - name: Upload validation manifest
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # actions/upload-artifact@v4
        with:
          name: veltrix-wat-daily-slate-readonly-validation
          path: backend/artifacts/wat-daily-slate-readonly-validation.json
          if-no-files-found: warn
          retention-days: 30
